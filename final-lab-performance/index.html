<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shop Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: #333;
            color: white;
            width: 100%;
            padding: 1rem 0;
            text-align: center;
        }
        .container {
            margin-top: 50px;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
        }
        h2 {
            color: #444;
        }
        .nav-menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        .nav-item {
            background-color: #007bff;
            color: white;
            padding: 15px;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
            font-weight: bold;
        }
        .nav-item:hover {
            background-color: #0056b3;
        }
        .search-btn {
            background-color: #28a745;
            grid-column: span 2;
        }
        .search-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<header>
    <h1>Shop Admin Dashboard</h1>
</header>

<div class="container">
    <h2>Welcome, Admin</h2>
    <p>Select a task below to manage employee records.</p>
    
    <div class="nav-menu">
        <!-- Registration Feature -->
        <a href="register.html" class="nav-item">Register Employee</a>
        
        
        <a href="update.html" class="nav-item">Update Information</a>
        
     
        <a href="search.html" class="nav-item search-btn">Search Employee</a>
        
       
        <a href="delete.html" class="nav-item" style="background-color: #dc3545;">Delete Employee</a>
    </div>
</div>

</body>
</html>
